name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Raw data matches its checksums
        run: python -m fininc verify

      # Includes the slow tests, which rebuild the district table and refit the models from the raw files, and the
      # tests that fail if a committed document, dashboard or Power BI project is out of date.
      - name: Tests
        run: pytest -q
